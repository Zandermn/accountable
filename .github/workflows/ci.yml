name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan repository for secrets
        run: gitleaks dir --config .gitleaks.toml --redact=100 --no-banner .

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: latest

      - name: Install project dependencies
        run: |
          uv sync --locked --python 3.12
          npm ci

      - name: Run quick checks
        run: npm run check:quick
