services:
  - type: web
    name: accountable
    runtime: python
    plan: free
    buildCommand: uv sync --locked --no-dev && npm ci --include=dev && npm run build
    startCommand: uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: 26.13.1
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
