[project]
name = "accountable"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "openpyxl>=3.1,<4", "python-multipart>=0.0.20", "defusedxml>=0.7.1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17.6",
    "ty>=0.0.109",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["*/backend/tests/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
include_namespace_packages = true
